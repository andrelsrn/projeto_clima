<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos da aplicação -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <main class="app-container">
        <header class="app-header">
            <i class="fa-solid fa-cloud-sun-rain header-icon"></i>
            <h1>Previsão do Tempo</h1>
        </header>

        <form id="weather-form" class="search-form">
            <div class="input-group">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="city" placeholder="Digite uma cidade..." required autocomplete="off">
            </div>
            <button type="submit" class="btn-search">
                <span>Buscar</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <section id="result" class="weather-result">
            <div class="empty-state">
                <i class="fa-solid fa-earth-americas"></i>
                <p>Digite o nome de uma cidade para consultar o clima em tempo real.</p>
            </div>
        </section>
    </main>

    <script src="assets/js/api.js"></script>
</body>
</html>
